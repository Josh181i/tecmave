<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promociones | TECMAVE CR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/theme-lighten.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/brand-red-hard.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar"><div class="brand"><img src="../assets/img/tecmave_logo_innovacion.jpg" alt=""><span>Tecmave</span></div><div class="subtle">Gestión</div><nav class="nav"></nav></aside>

    <header class="topbar">
      <button class="iconbtn" data-toggle-sidebar><i class="fa-solid fa-bars"></i></button>
      <div id="site-header" class="brand2"><img class="logo-xs" src="../assets/img/tecmave_logo_innovacion.jpg" alt="Tecmave" style="width:20px;height:20px;border-radius:6px;margin-right:6px;"><span>Promociones | TECMAVE CR</span></div>
      <div class="search">
        <input type="search" placeholder="Buscar clientes, placas, servicios…">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M21 21l-4.3-4.3M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z" stroke="currentColor" stroke-width="1.6"/>
        </svg>
      </div>
      <button id="language-toggle" class="iconbtn"><i class="fas fa-globe"></i></button>
      <button id="theme-toggle" class="iconbtn"><i class="fas fa-sun"></i></button>
      <button class="iconbtn"><i class="fa-regular fa-bell"></i></button>
      <button class="iconbtn"><i class="fa-regular fa-user"></i> <span id="user-display-name">Admin</span></button>
    </header>

    <main class="main">
        <main class="container">
            <section class="section">
                <div class="container grid cols-2">
                    <div class="card">
                        <h3>Crear/Editar Promoción</h3>
                        <div class="form-row">
                            <div><label>Título</label><input class="input" id="promo-title" placeholder="Ej. Descuento en llantas"/></div>
                            <div><label>Descuento (%)</label><input class="input" id="promo-discount" type="number" placeholder="0"/></div>
                        </div>
                        <label>Descripción</label>
                        <textarea class="input" id="promo-description" rows="4" placeholder="Detalles de la promoción"></textarea>
                        <div style="display:flex;gap:.5rem; margin-top: 1rem;">
                            <button onclick="savePromotion()">Guardar</button>
                            <button class="secondary" onclick="clearForm()">Limpiar</button>
                        </div>
                    </div>
                    <div class="card">
                        <h3>Promociones Activas</h3>
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Título</th>
                                    <th>Descuento</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="promotions-list">
                                <!-- Promotions will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </main>
  </div>
  <script src="../assets/js/dashboard.js"></script>
  <script defer src="../assets/js/nav-active.js"></script>
  <script defer src="../assets/js/role-ui.js"></script>
  <script src="../assets/js/theme-switcher.js"></script>
  <script src="../assets/js/language-switcher.js"></script>
  <script>
    let promotions = JSON.parse(localStorage.getItem('promotions')) || [];
    let editingIndex = null;

    function renderPromotions() {
      const promotionsList = document.getElementById('promotions-list');
      promotionsList.innerHTML = '';
      promotions.forEach((promo, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${promo.title}</td>
          <td>${promo.discount}%</td>
          <td>
            <button class="btn-small" onclick="editPromotion(${index})">Editar</button>
            <button class="btn-small ghost" onclick="deletePromotion(${index})">Eliminar</button>
          </td>
        `;
        promotionsList.appendChild(row);
      });
    }

    function savePromotion() {
      const title = document.getElementById('promo-title').value;
      const discount = document.getElementById('promo-discount').value;
      const description = document.getElementById('promo-description').value;

      if (editingIndex !== null) {
        promotions[editingIndex] = { title, discount, description };
        editingIndex = null;
      } else {
        promotions.push({ title, discount, description });
      }

      localStorage.setItem('promotions', JSON.stringify(promotions));
      renderPromotions();
      clearForm();
    }

    function editPromotion(index) {
      const promo = promotions[index];
      document.getElementById('promo-title').value = promo.title;
      document.getElementById('promo-discount').value = promo.discount;
      document.getElementById('promo-description').value = promo.description;
      editingIndex = index;
    }

    function deletePromotion(index) {
      promotions.splice(index, 1);
      localStorage.setItem('promotions', JSON.stringify(promotions));
      renderPromotions();
    }

    function clearForm() {
      document.getElementById('promo-title').value = '';
      document.getElementById('promo-discount').value = '';
      document.getElementById('promo-description').value = '';
      editingIndex = null;
    }

    document.addEventListener('DOMContentLoaded', renderPromotions);
  </script>
</body>
</html>
